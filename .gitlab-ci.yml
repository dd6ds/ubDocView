build-amd64:
  before_script:
    - echo "deb https://repo.ubports.com/ xenial_-_qt-5-12 main" | tee /etc/apt/sources.list.d/ubports-qt-5-12.list
    - apt-get update
    - apt-get dist-upgrade -y --purge
  artifacts:
    expire_in: 1 week
    paths:
    - build/x86_64-linux-gnu/app/*.click
  image: clickable/ci-16.04-amd64
  script:
  - clickable clean-build
  stage: build

build-arm64:
  before_script:
    - echo "deb https://repo.ubports.com/ xenial_-_qt-5-12 main" | tee /etc/apt/sources.list.d/ubports-qt-5-12.list
    - apt-get update
    - apt-get dist-upgrade -y --purge
  artifacts:
    expire_in: 1 week
    paths:
    - build/aarch64-linux-gnu/app/*.click
  image: clickable/ci-16.04-arm64
  script:
  - clickable clean-build
  stage: build

build-armhf:
  before_script:
    - echo "deb https://repo.ubports.com/ xenial_-_qt-5-12 main" | tee /etc/apt/sources.list.d/ubports-qt-5-12.list
    - apt-get update
    - apt-get dist-upgrade -y --purge
  artifacts:
    expire_in: 1 week
    paths:
    - build/arm-linux-gnueabihf/app/*.click
  image: clickable/ci-16.04-armhf
  rules:
  - if: $CI_COMMIT_TAG == null
  script:
  - clickable clean-build
  stage: build

publish-amd64:
  artifacts:
    expire_in: 1 week
    paths:
    - build/x86_64-linux-gnu/app/*.click
  image: clickable/ci-16.04-amd64
  rules:
  - if: $CI_COMMIT_TAG
  script:
  - clickable clean-build
  - clickable publish
  stage: deploy

publish-arm64:
  artifacts:
    expire_in: 1 week
    paths:
    - build/aarch64-linux-gnu/app/*.click
  image: clickable/ci-16.04-arm64
  rules:
  - if: $CI_COMMIT_TAG
  script:
  - clickable clean-build
  - clickable publish
  stage: deploy

publish-armhf:
  artifacts:
    expire_in: 1 week
    paths:
    - build/arm-linux-gnueabihf/app/*.click
  image: clickable/ci-16.04-armhf
  rules:
  - if: $CI_COMMIT_TAG
  script:
  - clickable clean-build
  - clickable publish "$CI_COMMIT_MESSAGE"
  stage: deploy
