build-amd64:
  artifacts:
    expire_in: 1 week
    paths:
    - build/x86_64-linux-gnu/app/*.click
  image: clickable/ci-16.04-amd64:16.04.4-qt5.9
  script:
  - clickable clean-build
  stage: build

build-arm64:
  artifacts:
    expire_in: 1 week
    paths:
    - build/aarch64-linux-gnu/app/*.click
  image: clickable/ci-16.04-arm64:16.04.4-qt5.9
  script:
  - clickable clean-build
  stage: build

build-armhf:
  artifacts:
    expire_in: 1 week
    paths:
    - build/arm-linux-gnueabihf/app/*.click
  image: clickable/ci-16.04-armhf:16.04.4-qt5.9
  rules:
  - if: $CI_COMMIT_TAG == null
  script:
  - clickable clean-build
  stage: build

publish-amd64:
  artifacts:
    expire_in: 1 week
    paths:
    - build/x86_64-linux-gnu/app/*.click
  image: clickable/ci-16.04-amd64:16.04.4-qt5.9
  rules:
  - if: $CI_COMMIT_TAG
  script:
  - clickable clean-build
  - clickable publish
  stage: deploy

publish-arm64:
  artifacts:
    expire_in: 1 week
    paths:
    - build/aarch64-linux-gnu/app/*.click
  image: clickable/ci-16.04-arm64:16.04.4-qt-5.9
  rules:
  - if: $CI_COMMIT_TAG
  script:
  - clickable clean-build
  - clickable publish
  stage: deploy

publish-armhf:
  artifacts:
    expire_in: 1 week
    paths:
    - build/arm-linux-gnueabihf/app/*.click
  image: clickable/ci-16.04-armhf:16.04.4-qt5.9
  rules:
  - if: $CI_COMMIT_TAG
  script:
  - clickable clean-build
  - clickable publish "$CI_COMMIT_MESSAGE"
  stage: deploy
