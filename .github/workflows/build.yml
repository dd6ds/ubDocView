# Builds the arm64 click package and, for a version tag or on request,
# publishes it as a GitHub release.
name: Build click

on:
  # Start by hand: GitHub -> Actions -> "Build click" -> "Run workflow".
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the result as a GitHub release"
        type: boolean
        default: false
  # Pushing a tag such as v3.1.3 builds and publishes a release.
  push:
    tags: ['v*']

permissions:
  contents: write          # needed to create releases

concurrency:
  group: build-click-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # The version lives in CMakeLists.txt: project(... VERSION x.y.z ...);
      # manifest.json is generated from click/manifest.json.in at build time.
      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/^project([^)]*VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read the version from CMakeLists.txt"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A release tag has to match the version inside the package.
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $VERSION"
            exit 1
          fi

      # Clickable prefers podman over docker when both exist. Rootless podman on
      # the GitHub runner has no subordinate UID range, so it cannot unpack the
      # Ubuntu Touch 24.04 image ("container ID 32011 cannot be mapped to a host
      # ID"). Removing podman makes clickable use the runner's docker instead.
      - name: Use docker instead of podman
        run: |
          sudo apt-get remove -y podman buildah skopeo || true
          if command -v podman; then echo "::error::podman is still installed"; exit 1; fi
          docker version --format 'docker {{.Server.Version}}'

      # Clickable builds in its Docker image (Ubuntu Touch 24.04, arm64),
      # the same way as "clickable build" locally.
      - name: Install clickable
        run: |
          pipx install clickable-ut
          clickable --version

      # The click is ~200 MB (LibreOffice); make some room on the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # --all = "clickable build --libs" (fetches the prebuilt LibreOfficeKit
      # from the UBports CI, needed for the office-document plugin) + the app.
      - name: Build click (arm64)
        run: clickable build --all --arch arm64 --non-interactive

      - name: Collect click
        run: |
          mkdir -p dist
          cp build/aarch64-linux-gnu/app/*.click dist/
          (cd dist && sha256sum *.click > SHA256SUMS)
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ubdocview-${{ steps.version.outputs.version }}-arm64
          path: dist/
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            PRERELEASE=""
          else
            TAG="build-$(date -u +%Y%m%d-%H%M)"
            PRERELEASE="--prerelease"
          fi
          cat > notes.md <<NOTES
          ubDocView ${{ steps.version.outputs.version }} for Ubuntu Touch (arm64), built from commit ${GITHUB_SHA::7}.
          Fork of the UBports Document Viewer with full-text search in PDF documents.

          **Install** (phone on USB, developer mode on):
          \`\`\`bash
          adb push docviewer.ubports_*_arm64.click /home/phablet/Downloads/
          adb shell pkcon install-local --allow-untrusted /home/phablet/Downloads/docviewer.ubports_*_arm64.click
          \`\`\`
          Or open the .click file on the phone with the OpenStore app.

          Note: the package keeps the id docviewer.ubports, so it replaces the
          Document Viewer from the OpenStore (and an OpenStore update replaces it again).
          NOTES
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ubDocView $TAG" \
            --notes-file notes.md \
            $PRERELEASE
